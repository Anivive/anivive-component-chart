# A list of containers that should run the pods of this component
containers: []
initContainers: []

service:
  type: ClusterIP
  labels: {}
  annotations: {}
  ports: []
  externalIPs: []

labels: {}
annotations: {}

ingress:
  labels: {}
  annotations: {}
  rules: []

httproute:
  enabled: false
